# Exact SDK31/preinstrumentation7 coordinate declared by Robolectric 4.17 DefaultSdkProvider.
robolectric-sdk31 = "12-robolectric-7732740-i7"
junit4 = "4.13.2"
# Aligned with the pinned kotlin-test-junit5 POM, rather than an independent latest selection.
junit5 = "5.10.1"
