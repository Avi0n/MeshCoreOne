name: Android repair status preview (paused)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-port-controller
  cancel-in-progress: false

jobs:
  status:
    name: Dry-run status (no repair launch)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    env:
      ANDROID_PORT_DISPATCH_MODE: off
      ANDROID_PORT_PAUSED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - run: python tools/android-port/controller/dispatch.py --dry-run status
      - name: No repair without authenticated same-worker identity, usage and unpause
        run: python tools/android-port/controller/gate_runtime.py capabilities
