name: Android upstream comparison proposals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/android-port/resync.py
      - docs/android/upstream/**
      - .github/workflows/android-upstream-sync.yml
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Explicit reviewed upstream commit SHA; this run does not approve or apply it
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    name: Upstream proposal fixtures
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read-only exact tooling candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned parser dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Run real Git, ownership, completeness and dry-run assertions without upstream access
        env:
          UPSTREAM_TEST_REPORT: ${{ runner.temp }}/upstream-fixtures/assertions.json
        run: python tools/android-port/resync.py --self-test --output $env:UPSTREAM_TEST_REPORT
      - name: Keep exact discovered assertion counts as data
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-fixtures
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

  compare:
    name: Read-only upstream owner proposals
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read trusted default-branch comparison tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install existing checksum-pinned parser dependency
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Preserve source and owner integrity before reading the candidate
        run: python tools/android-port/controller/validate.py
      - name: Compare explicit upstream objects; never execute candidate code or advance the pin
        env:
          UPSTREAM_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          UPSTREAM_REPORT_PATH: ${{ runner.temp }}/upstream-proposals/report.json
        run: >-
          python tools/android-port/resync.py --fetch-candidate
          --candidate "$UPSTREAM_CANDIDATE_COMMIT" --output "$UPSTREAM_REPORT_PATH"
      - name: Retain the complete data-only review proposal, including blocked new inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-proposals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-proposals
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
