name: Android candidate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify candidate scopes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      controller: ${{ steps.changed.outputs.controller }}
      scaffold: ${{ steps.changed.outputs.scaffold }}
      protocol: ${{ steps.changed.outputs.protocol }}
      backup: ${{ steps.changed.outputs.backup }}
      external-oracle: ${{ steps.changed.outputs['external-oracle'] }}
    steps:
      - name: Read-only exact candidate and immutable diff endpoints
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Classify changed inputs with fail-safe defaults
        run: |
          python tools/android-port/oracle/workflow_scope.py --event-name "${{ github.event_name }}" --event-path "${{ github.event_path }}" --output "$GITHUB_OUTPUT"
          python tools/android-port/controller/test_runner.py --candidate-event-name "${{ github.event_name }}" --candidate-event-path "${{ github.event_path }}" --scope-output "$GITHUB_OUTPUT"

  controller:
    name: Controller and workflow policy
    needs: [scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read-only exact candidate
        if: ${{ needs.scope.outputs.controller == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python
        if: ${{ needs.scope.outputs.controller == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install checksum-pinned YAML parser
        if: ${{ needs.scope.outputs.controller == 'true' }}
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Run controller tests once
        if: ${{ needs.scope.outputs.controller == 'true' }}
        run: |
          python tools/android-port/controller/test_runner.py --include-tests tools/android-port/local --include-tests android/parity-tests --candidate-event-name "${{ github.event_name }}" --candidate-event-path "${{ github.event_path }}"
          python tools/android-port/controller/verification_config.py --check
          python tools/android-port/controller/validate.py
          python tools/android-port/portmap.py
          python android/parity-tests/audit.py --check
          python android/parity-tests/semantic.py --check
      - name: No controller inputs selected
        if: ${{ needs.scope.outputs.controller != 'true' }}
        run: echo "Controller suite not selected."

  build:
    name: One Linux Android build
    needs: [scope, controller]
    if: >-
      ${{
        needs.scope.outputs.scaffold == 'true' ||
        needs.scope.outputs.protocol == 'true' ||
        needs.scope.outputs.backup == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Read-only exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
          architecture: x64
      - name: Install checksum-pinned workflow parser
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --no-deps --only-binary=:all: -r tools/android-port/controller/requirements-ci.txt --quiet
      - name: Declare one toolchain, work and Gradle cache root
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'meshcoreone-ci'
          "ANDROID_CI_WORK=$(Join-Path $root 'work')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_CI_STATE=$(Join-Path (Join-Path $root 'toolchain') 'environment.json')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GRADLE_USER_HOME=$(Join-Path $root 'gradle-home')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore verified Gradle dependency cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.GRADLE_USER_HOME }}
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/**/gradle.lockfile', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Validate frozen source inputs
        run: |
          python tools/android-port/test_inventory.py --check
          python tools/android-port/extract_vectors.py --check
      - name: Run selected Python oracle assertions
        if: ${{ needs.scope.outputs.scaffold == 'true' }}
        run: python tools/android-port/oracle/run_tests.py --output (Join-Path $env:RUNNER_TEMP 'oracle-tests.json')
      - name: Provision exact first-party JDK and SDK archives
        run: python tools/android-port/controller/ci.py provision --root (Split-Path $env:ANDROID_CI_STATE -Parent) --accept-sdk-license
      - name: Check worker readiness
        run: python tools/android-port/controller/ci.py preflight
      - name: Run every selected Linux and Android task in one Gradle invocation
        env:
          RUN_SCAFFOLD: ${{ needs.scope.outputs.scaffold }}
          RUN_PROTOCOL: ${{ needs.scope.outputs.protocol }}
          RUN_BACKUP: ${{ needs.scope.outputs.backup }}
        run: |
          $scopes = @()
          if ($env:RUN_SCAFFOLD -eq 'true') { $scopes += @('--scope', 'scaffold') }
          if ($env:RUN_PROTOCOL -eq 'true') { $scopes += @('--scope', 'protocol') }
          if ($env:RUN_BACKUP -eq 'true') { $scopes += @('--scope', 'backup') }
          & python tools/android-port/controller/ci.py run --stage scaffold @scopes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate localization discovery
        if: ${{ needs.scope.outputs.scaffold == 'true' }}
        run: >-
          python tools/android-port/l10n_convert.py --check
          --verify-android-tests android/core/l10n/build/test-results/testDebugUnitTest
      - name: Inspect exact APK and static alignment
        if: ${{ needs.scope.outputs.scaffold == 'true' }}
        run: python tools/android-port/controller/ci.py inspect
      - name: Transfer actual backup bytes to the platform oracle
        if: ${{ needs.scope.outputs.backup == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: android/core/data/build/reports/wp203/interop/
          if-no-files-found: error
          retention-days: 1

  external-oracle:
    name: Swift codec oracle
    needs: [scope, controller]
    if: ${{ needs.scope.outputs['external-oracle'] == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
      - name: Execute pinned Swift codecs and independent crypto
        run: >-
          python tools/android-port/oracle/codec_harness.py run
          --output "${{ runner.temp }}/codec"

  backup-oracle:
    name: SwiftData restore and export oracle
    needs: [scope, build]
    if: ${{ needs.scope.outputs.backup == 'true' }}
    runs-on: macos-26-intel
    timeout-minutes: 40
    steps:
      - name: Read-only exact candidate and frozen source objects
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.4"
      - name: Download actual Kotlin-produced backup bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backup-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kotlin-input
      - name: Execute real SwiftData restore and export
        run: >-
          python tools/android-port/oracle/wp203_interop.py
          --input "${{ runner.temp }}/kotlin-input"
          --output "${{ runner.temp }}/swift-output"
          --stage-root "${{ runner.temp }}/frozen-source"

  android-ci:
    name: android-ci
    if: ${{ always() }}
    needs: [scope, controller, build, external-oracle, backup-oracle]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected scope to pass
        env:
          CONTROLLER_SELECTED: ${{ needs.scope.outputs.controller }}
          SCAFFOLD_SELECTED: ${{ needs.scope.outputs.scaffold }}
          PROTOCOL_SELECTED: ${{ needs.scope.outputs.protocol }}
          BACKUP_SELECTED: ${{ needs.scope.outputs.backup }}
          EXTERNAL_SELECTED: ${{ needs.scope.outputs['external-oracle'] }}
          CONTROLLER_RESULT: ${{ needs.controller.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXTERNAL_RESULT: ${{ needs.external-oracle.result }}
          BACKUP_RESULT: ${{ needs.backup-oracle.result }}
        run: |
          test "$CONTROLLER_RESULT" = "success"
          if [ "$SCAFFOLD_SELECTED" = "true" ] || [ "$PROTOCOL_SELECTED" = "true" ] || [ "$BACKUP_SELECTED" = "true" ]; then
            test "$BUILD_RESULT" = "success"
          else
            test "$BUILD_RESULT" = "skipped"
          fi
          if [ "$EXTERNAL_SELECTED" = "true" ]; then
            test "$EXTERNAL_RESULT" = "success"
          else
            test "$EXTERNAL_RESULT" = "skipped"
          fi
          if [ "$BACKUP_SELECTED" = "true" ]; then
            test "$BACKUP_RESULT" = "success"
          else
            test "$BACKUP_RESULT" = "skipped"
          fi
