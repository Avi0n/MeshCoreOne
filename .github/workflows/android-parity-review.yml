name: Android authenticated review publication

on:
  workflow_dispatch:
    inputs:
      work_package:
        description: Assigned WP; this workflow never launches a worker or reviewer
        required: true
        type: string
      pull_request:
        description: Existing ready PR targeting the current default branch
        required: true
        type: string
      review_id:
        description: Actual exact-bound authenticated coordinator source-review receipt ID
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read
  issues: read

concurrency:
  group: android-port-controller
  cancel-in-progress: false

jobs:
  publish:
    name: Native review ${{ inputs.work_package }} PR ${{ inputs.pull_request }} receipt ${{ inputs.review_id }}
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORK_PACKAGE: ${{ inputs.work_package }}
      PR_NUMBER: ${{ inputs.pull_request }}
      REVIEW_ID: ${{ inputs.review_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Fetch candidate objects as data only
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 2
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
      - name: Validate current server facts and publish exact-head checks
        env:
          ANDROID_PORT_GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/android-port/controller/native_review.py publish
          --trusted-base "$GITHUB_SHA" --wp "$WORK_PACKAGE"
          --pr "$PR_NUMBER" --review-id "$REVIEW_ID"
