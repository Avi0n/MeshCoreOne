name: Android gate audit preview (paused)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Already-fetched full immutable candidate SHA, or leave empty for inventory only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-port-controller
  cancel-in-progress: false

jobs:
  audit:
    name: Offline trusted audit (not gate-integrity)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ANDROID_PORT_DISPATCH_MODE: off
      ANDROID_PORT_PAUSED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - name: Validate pinned inventory
        run: python tools/android-port/controller/validate.py
      - name: Audit candidate data without executing it or approving a human gate
        if: inputs.candidate_sha != ''
        run: python tools/android-port/controller/validate.py --gate-base "$GITHUB_SHA" --gate-candidate "$CANDIDATE_SHA"
      - name: Missing authenticated review publisher or required human acceptance is BLOCKED
        if: ${{ always() }}
        run: python tools/android-port/controller/gate_runtime.py capabilities
