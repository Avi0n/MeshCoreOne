name: Android port dispatch preview (paused)

on:
  workflow_dispatch:
    inputs:
      work_package:
        description: Approved WP to preview, never launch
        required: true
        default: WP-001
        type: string

permissions:
  contents: read

concurrency:
  group: android-port-controller
  cancel-in-progress: false

jobs:
  preview:
    name: Trusted dry-run preview only
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    env:
      WORK_PACKAGE: ${{ inputs.work_package }}
      ANDROID_PORT_DISPATCH_MODE: off
      ANDROID_PORT_PAUSED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - run: python tools/android-port/controller/dispatch.py --dry-run cloud --wp "$WORK_PACKAGE"
      - name: Explicit activation and proven live integrations are still required
        run: python tools/android-port/controller/gate_runtime.py capabilities
