# Excluded paths
excluded:
  - .build
  - .derivedData
  - .worktrees
  - build
  - tmp
  - MC1.xcodeproj
  - MC1/Resources/Generated
  - MeshCore/.build
  - MeshCoreBridge/.build
  - mc-ref
  - MC1Services/.build
  - fastlane
  - scripts

# Disabled rules
disabled_rules:
  - identifier_name
  - todo
  - nesting
  - multiple_closures_with_trailing_closure
  - trailing_comma
  - non_optional_string_data_conversion
  - optional_data_string_conversion
  - file_length           # Addressed by Workstream C (AppState decomposition)
  - type_body_length      # Addressed by Workstream C (AppState decomposition)
  - type_name             # Catches iOSBLETransport (intentional) and long test names
  - switch_case_alignment  # Triggers on idiomatic single-line switch expressions
  - for_where              # Style preference; where clause can hurt readability

# Thresholds tuned to current codebase. Tighten in future PRs.
line_length:
  warning: 250
  error: 350

function_body_length:
  warning: 200
  error: 500

cyclomatic_complexity:
  warning: 30
  error: 55

function_parameter_count:
  warning: 10
  error: 14

large_tuple:
  warning: 4
  error: 6

# Project conventions from AGENTS.md that hold without exception.
custom_rules:
  no_print:
    name: "No print"
    regex: '(?<![\w.])(Swift\.)?print\s*\('
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    excluded: '(Tests|UITests)/'
    message: "Log with Logger, not print()."
    severity: error
  no_environment_appstate_type:
    name: "AppState environment key"
    regex: '@Environment\(\s*AppState\.self\s*\)'
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    message: "Use @Environment(\\.appState); this project injects AppState through AppStateKey."
    severity: error
  observable_mainactor_order:
    name: "@Observable then @MainActor"
    regex: '@MainActor\s+@Observable\b|@Observable[ \t]+@MainActor|@Observable[ \t]*\n(?![ \t]*@MainActor\b)'
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    message: "@Observable classes are @MainActor: @Observable on one line, @MainActor on the next."
    severity: error
